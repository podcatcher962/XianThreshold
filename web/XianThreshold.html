<style>

}
html[lang="en"] body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 14px;gap:12px}

.panel{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:4px}

.track{border-left:2px solid var(--line);padding-left:14px;margin-left:5px}

.warnbox{border-left:3px solid var(--warn);background:var(--card2);border-radius:0 10px 10px 0;padding:14px 16px;margin-bottom:14px}

.warnbox .t2{font-size:.8125rem;color:var(--tx2);line-height:1.8}

.exitbox .t2{font-size:.8125rem;color:var(--tx2);line-height:1.8}
.epi{background:var(--card2);border:1px solid var(--acc2);border-radius:var(--r);padding:20px;margin-bottom:14px;text-align:center}

.epi .col{flex:1;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px}
.epi .ct{font-size:.6875rem;color:var(--tx3);letter-spacing:.08em;margin-bottom:6px}
.epi .cb{font-size:.8125rem;color:var(--tx);line-height:1.6}
.epi .arw{display:flex;align-items:center;color:var(--tx3);font-size:1rem}
.omen{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.omen .oh{background:var(--card2);padding:11px 14px;font-size:.875rem;letter-spacing:.04em}
.track4{padding:4px 14px 12px}
.tr4{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.tr4:last-child{border-bottom:none}

.tr4.a .lb{color:var(--acc2)}

.stat{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.stat .si{min-width:76px}
.stat .sv{font-size:1.375rem;color:var(--acc2);font-family:Georgia,serif;letter-spacing:.02em}
.stat .sk{font-size:.6875rem;color:var(--tx3);letter-spacing:.06em}
.wlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border-bottom:none}
.wrow:hover{background:var(--card2)}
.wrow .wn{flex:1;font-size:.875rem}
.wrow .wc{font-size:.75rem;color:var(--tx3)}
.lightbox{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;font-size:.8125rem;color:var(--tx2);line-height:1.85}
.lightbox b{color:var(--tx);font-weight:500}
svg{display:block;width:100%;height:auto}
footer{text-align:center;font-size:.6875rem;color:var(--tx3);padding:26px 0 10px;letter-spacing:.06em;line-height:2}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg2);display:flex;align-items:center;justify-content:center;overflow:hidden}
#splash.gone{display:none}
#splash.closing{opacity:0;transition:opacity .5s ease}
.sp{position:relative;text-align:center;padding:34px 26px;max-width:560px;z-index:2}
.sp .zh{font-size:2.5rem;letter-spacing:.32em;font-family:Georgia,"Songti SC",serif;color:var(--tx);text-indent:.32em}
html[lang="en"] .sp .zh{font-size:2rem;letter-spacing:.14em;text-indent:.14em}
.sp .en{font-size:.75rem;color:var(--tx3);letter-spacing:.28em;text-transform:uppercase;margin-top:12px}
.sp .door4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 26px}
.sp .door4 div{font-size:.6875rem;color:var(--tx3);letter-spacing:.08em;line-height:1.9;border-top:1px solid var(--line);padding-top:9px}
.sp .q{font-size:.9375rem;color:var(--tx2);line-height:2;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.sp .go{margin-top:26px}
.sp .skip{display:block;margin:16px auto 0;background:none;border:none;color:var(--tx3);font-size:.75rem;cursor:pointer;font-family:inherit;letter-spacing:.1em}
.sp .skip:hover{color:var(--tx2)}
.trend{display:flex;gap:4px;align-items:flex-end;height:74px;margin-top:14px}
.trend .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.trend .bar{width:100%;border-radius:4px;background:var(--acc2);opacity:.85;min-height:3px}
.trend .bar.e{background:var(--line);opacity:.5;height:3px!important}
.trend .lb{font-size:.5625rem;color:var(--tx3)}
.seg{display:flex;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.seg button{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:16px;padding:4px 12px;font-size:.75rem;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--card2);border-color:var(--tx3);color:var(--tx)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--tx3);font-size:.8125rem;line-height:1.9}
.steps{counter-reset:s}
.steps div{counter-increment:s;padding:9px 0 9px 30px;position:relative;font-size:.8125rem;color:var(--tx2);border-bottom:1px solid var(--line);line-height:1.75}
.steps div:last-child{border-bottom:none}
.steps div::before{content:counter(s);position:absolute;left:0;top:9px;width:19px;height:19px;border-radius:50%;border:1px solid var(--line);color:var(--tx3);font-size:.6875rem;display:flex;align-items:center;justify-content:center}
.qa{border-bottom:1px solid var(--line);padding:11px 0}
.qa:last-child{border-bottom:none}
.qa .qq{font-size:.8125rem;color:var(--tx);margin-bottom:5px}
.qa .aa{font-size:.8125rem;color:var(--tx2);line-height:1.8}
.tos p{margin-bottom:10px}
.tos p:last-child{margin-bottom:0}
.sig{font-size:.75rem;color:var(--tx3);letter-spacing:.08em;line-height:2.1}
.docnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.docnav button{background:transparent;border:1px solid var(--line);color:var(--tx2);border-radius:16px;padding:5px 13px;font-size:.75rem;cursor:pointer;font-family:inherit;letter-spacing:.04em}
.docnav button:hover{border-color:var(--tx3);color:var(--tx)}
.docnav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* ===== v0.3 沉静层：覆盖色板、加纸纹、衬线标题、放缓动效 ===== */
:root{
  --bg:#141517; --bg2:#0E0F11; --card:#1B1D20; --card2:#222528; --line:#2E3135;
  --tx:#E7E5E0; --tx2:#9A9791; --tx3:#6A6862;
  --acc:#BE5741; --accd:#7A3325; --accg:rgba(190,87,65,.38); --acc2:#579985; --warn:#D99B39; --danger:#D2604A;
  --r:8px; --serif:Georgia,"Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","Times New Roman",serif;
}
html[data-theme="light"]{
  --bg:#F1EDE4; --bg2:#E7E2D6; --card:#FAF8F3; --card2:#F2EEE4; --line:#DFD9CB;
  --tx:#1C1D1F; --tx2:#585550; --tx3:#8A857B;
  --acc:#A9482F; --accd:#7A3325; --accg:rgba(169,72,47,.24); --acc2:#38796A; --warn:#8C6110; --danger:#A63A2C;
}
.paper{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%;opacity:.38}
html[data-theme="light"] .paper{opacity:.5}
.wrap{position:relative;z-index:1}
body{line-height:1.78}
.brand h1,.card h2,.sp .zh,.epi .word,.dui .quote,.sd-title,.stat .sv,.knot .k1{font-family:var(--serif)}
.brand h1{letter-spacing:.2em;font-weight:400}
.card h2{letter-spacing:.1em;font-weight:400}
.card{padding:20px;margin-bottom:16px;transition:border-color .45s ease}
.divider{margin:20px 0;opacity:.7}
.muted{line-height:1.85}
.btn,.chip,.ic,.knot{transition:border-color .45s ease,background-color .45s ease,color .45s ease,opacity .45s ease}
.btn{letter-spacing:.1em;font-weight:400}
.seal{border-radius:6px;font-weight:400;letter-spacing:0}
header{padding:22px 0 16px}
nav button{letter-spacing:.1em}
.brand p{letter-spacing:.16em}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== 开屏：意象化中式海报（纯 SVG，零图片） ===== */
#splash{background:radial-gradient(ellipse at 50% 38%,#191B1E,#0B0C0E 72%);flex-direction:column;justify-content:center;padding:18px 0 10px}
html[data-theme="light"] #splash{background:radial-gradient(ellipse at 50% 38%,#F6F2E8,#E3DCCD 72%)}
/* 远山随主题自适应：深色下是黛青，亮色下收成淡墨晕 */
.spsvg .mist{opacity:.5}
.spsvg .mist2{opacity:.38}
html[data-theme="light"] .spsvg .mist{opacity:.16}
html[data-theme="light"] .spsvg .mist2{opacity:.11}
.spsvg{position:relative;inset:auto;width:100%;height:auto;max-height:46vh;flex:none;z-index:1}
.sp{position:relative;z-index:3}
/* ===== 开屏意象：一钩月 / 一痕远山 / 一线光（浓度一律写在这里，CSS 的 opacity 会覆盖 SVG 属性）===== */
.spsvg .star{opacity:1}
html[data-theme="light"] .spsvg .star{opacity:0}
.spsvg .moon{opacity:.92}
.spsvg .halo{opacity:.55}
html[data-theme="light"] .spsvg .halo{opacity:.28}
.spsvg .moonring{opacity:0}
html[data-theme="light"] .spsvg .moonring{opacity:.5}
.spsvg .m1{opacity:.09}
.spsvg .m2{opacity:.13}
.spsvg .m3{opacity:.17}
html[data-theme="light"] .spsvg .m1{opacity:.07}
html[data-theme="light"] .spsvg .m2{opacity:.10}
html[data-theme="light"] .spsvg .m3{opacity:.13}
.seam{animation:seambreathe 9s ease-in-out infinite}
.halo{animation:halobreathe 13s ease-in-out infinite}
.tw1{animation:twinkle 6s ease-in-out infinite}
.tw2{animation:twinkle 8.5s ease-in-out .8s infinite}
.tw3{animation:twinkle 7.2s ease-in-out 2.1s infinite}
@keyframes seambreathe{0%,100%{opacity:.72}50%{opacity:1}}
@keyframes halobreathe{0%,100%{opacity:.45}50%{opacity:.75}}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:.1}}
.sp .zh{font-size:2.6rem;letter-spacing:.38em;text-indent:.38em;font-weight:400}
html[lang="en"] .sp .zh{font-size:1.7rem;letter-spacing:.16em;text-indent:.16em}
.sp .en{font-size:.8125rem;color:var(--tx2);letter-spacing:.26em;text-transform:none;margin-top:12px;font-family:var(--serif)}
.sp .en2{font-size:.8125rem;color:var(--tx2);letter-spacing:.24em;margin-top:5px}
.sp .q{font-family:var(--serif);font-size:1rem;letter-spacing:.04em;line-height:2.1}
.sp .door4 div{letter-spacing:.14em;line-height:2.1}
.sp .btn{background:transparent;border:1px solid var(--acc);color:var(--acc);letter-spacing:.3em;padding:11px 30px}
.sp .btn:hover{background:var(--acc);color:#fff;filter:none}
.sp .skip{letter-spacing:.24em}
.sp .ink{max-width:520px;margin:0 auto}

/* ===== 静室：呼吸圈 ===== */
.breathe{position:relative;width:224px;height:224px;margin:30px auto 8px;display:flex;align-items:center;justify-content:center}
.breathe .ring{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line)}
.breathe .ring2{position:absolute;inset:26px;border-radius:50%;border:1px solid var(--line);opacity:.5}
.breathe .core{position:absolute;top:50%;left:50%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:var(--acc2);opacity:.14;transform:scale(.6);transition:transform 6s cubic-bezier(.37,0,.63,1),opacity 6s linear}
.breathe.in .core{transform:scale(1);opacity:.24;transition-duration:4s}
.breathe.out .core{transform:scale(.6);opacity:.12;transition-duration:6s}
.breathe .lbl{position:relative;font-family:var(--serif);font-size:1.5rem;letter-spacing:.24em;color:var(--tx2);text-indent:.24em}
.stillbox{text-align:center;padding:8px 0 4px}
.stillwords{font-family:var(--serif);font-size:1.0625rem;line-height:2.1;letter-spacing:.06em;color:var(--tx);text-align:center;padding:22px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}

/* ===== 东西对读 ===== */
.dui-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 0}
@media(max-width:560px){.dui-pair{grid-template-columns:1fr}}
.dui-side{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:15px 16px}
.dui-side.w{border-left:2px solid var(--acc);border-radius:2px 8px 8px 2px}
.dui-side.e{border-left:2px solid var(--acc2);border-radius:2px 8px 8px 2px}
.dui-src{font-size:.6875rem;color:var(--tx3);letter-spacing:.14em;margin-bottom:9px}
.dui-quote{font-size:.9375rem;line-height:2;color:var(--tx);letter-spacing:.03em}
.dui-ask{font-family:var(--serif);font-size:1rem;line-height:2;color:var(--tx);text-align:center;padding:16px 6px 4px;letter-spacing:.04em}
.dui-note{font-size:.6875rem;color:var(--tx3);line-height:1.8;margin-top:12px}

/* ===== 本周老路 ===== */
.wkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.8125rem}
.wkrow:last-child{border-bottom:none}
.wkrow .wkp{flex:1;color:var(--tx2)}
.wkrow .wkn{font-family:var(--serif);color:var(--acc);font-size:.9375rem}
.wkrow .wkd{font-size:.75rem;color:var(--tx3);width:52px;text-align:right}

/* ---------- ① 墨色（浅色主题单独一套） ---------- */
:root{

  --inkm:#C6A98A; --inkbg:#1D2023;
}

  --inkm:#B9764F; --inkbg:#E6E2D8;
}
.ink{display:block;width:100%;height:auto;background:var(--inkbg)}

.ink .m3{fill:var(--ink3)}
.ink .mw{fill:none;stroke:var(--ink3);stroke-width:1.1}

.ink .st{fill:var(--inkm);opacity:.55}
.ink .cl{fill:var(--ink2)}

.inkcard{padding:0!important;overflow:hidden}

.inkcard .qknote{padding:8px 20px 18px}

.quizcard .minink .ink{height:92px}
.stillink{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:20px}
.gl{display:inline-block;width:15px;height:15px;vertical-align:-2px;margin-right:7px;color:var(--acc2);opacity:.9}
.gl svg{display:block;width:100%;height:100%}
.dbar{display:inline-flex;gap:3px;vertical-align:3px;margin-left:2px}
.dbar .d{width:5px;height:5px;border-radius:50%;background:var(--line);display:block}
.dbar .d.on{background:var(--acc2)}
.tag.dots{display:inline-flex;align-items:center}
.gates{display:flex;gap:10px;margin:14px 0 2px}
.gate{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:12px 3px 10px;color:var(--tx2);transition:border-color .45s ease,color .45s ease}
.gate .gi{width:28px;height:28px;margin:0 auto 7px;color:var(--acc2);opacity:.85}
.gate .gt{font-size:.75rem;letter-spacing:.1em;line-height:1.4}

/* 导航原本就是横向可滚的（scrollbar-width:none 只对 Firefox 生效），
   Chromium 下会露出滚动条；顺手补上。
   七项之后窄屏放不下（393 宽真机可用 361px，七项自然宽约 420px），
   故在手机上收紧间距与内边距：七项合计约 324px，360px 屏也不溢出；
   再宽的屏走上面的宽松样式，英文态超宽则回落到横向滚动兜底 */
nav::-webkit-scrollbar{display:none}
@media(max-width:560px){nav{gap:4px}nav button{padding:7px 6px;letter-spacing:.03em}}

/* ---------- ② 动效 ---------- */
@keyframes v05drift{from{transform:translateX(-16px)}to{transform:translateX(16px)}}
@keyframes v05twinkle{0%,100%{opacity:.2}50%{opacity:.85}}
@keyframes v05rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes v05ring{0%{transform:scale(.55);opacity:.55}100%{transform:scale(1.6);opacity:0}}
.ink .cl{animation:v05drift 30s ease-in-out infinite alternate;transform-box:fill-box}
.ink .st{animation:v05twinkle 5s ease-in-out infinite}
.ink .st:nth-of-type(even){animation-delay:1.7s}
#main[data-anim="1"]>.card{animation:v05rise .5s cubic-bezier(.2,.7,.3,1) both}
#main[data-anim="1"]>.card:nth-child(2){animation-delay:.06s}
#main[data-anim="1"]>.card:nth-child(3){animation-delay:.12s}
#main[data-anim="1"]>.card:nth-child(4){animation-delay:.18s}
#main[data-anim="1"]>.card:nth-child(5){animation-delay:.24s}
#main[data-anim="1"]>.card:nth-child(n+6){animation-delay:.3s}
/* 静室：呼吸圈外再套一圈慢慢散开的水纹 */
.breathe .ripple{position:absolute;top:50%;left:50%;width:132px;height:132px;margin:-66px 0 0 -66px;
  border-radius:50%;border:1px solid var(--acc2);opacity:.4;animation:v05ring 10s ease-out infinite}
.breathe .ripple.d2{animation-delay:3.3s}
.breathe .ripple.d3{animation-delay:6.6s}
html[data-motion="low"] .ink .cl,html[data-motion="low"] .ink .st,
html[data-motion="low"] .breathe .ripple{animation:none}
@media(prefers-reduced-motion:reduce){
  .ink .cl,.ink .st,.breathe .ripple,#main[data-anim="1"]>.card{animation:none!important}
}

];

var OMEN_DB=[
O(['筷子','掉筷','筷落','chopstick'],{zh:'筷子落地',en:'Chopsticks fell'},{zh:'江浙称「筷落客到」，北方有「落地惊神」的说法——不是预兆，是把日常异动当成缘分动了动。',en:'In Jiangnan, dropped chopsticks mean a guest is coming. Not an omen, just a way of reading everyday jitter as the world stirring.'},{zh:'你多半正处在「意义敏感」的状态里。事后应验的会被记住，没应验的会被自动忘掉。',en:'You are probably in a meaning-sensitive state. What comes true is remembered; what does not is quietly dropped.'},{zh:'先看看是不是真的累了、手滑了、桌子太油了。',en:'Check first: tired hands, a slippery table, a long day.'},{zh:'今天若有人来，添双筷。若没人来，也给自己添一双。',en:'If someone comes, add a pair of chopsticks. If no one comes, add one for yourself.'}),
O(['水','河','海','大水','water'],{zh:'梦到水',en:'Dreaming of water'},{zh:'水在传统解梦里主「财」也主「情」，涨落各有说法——同一场梦能有三种解释，正说明它不是答案。',en:'Traditional readings tie water to both fortune and feeling. Three readings for one dream is itself the point: it is not an answer.'},{zh:'水常出现在情绪积压期，尤其是说不出口的那一类。',en:'Water shows up when feeling has accumulated, especially the kind you have not said out loud.'},{zh:'睡前两小时有没有看剧、刷手机、喝太多水？',en:'Any screens, or too much water, in the two hours before sleep?'},{zh:'写一句：今天有什么事像水一样，我按住了没让它流出来。',en:'Write one line: what today felt like water you held back from flowing?'}),
O(['坠落','掉下去','摔','高空','fall'],{zh:'梦到坠落',en:'Dreaming of falling'},{zh:'民间称「坠落惊」，多与身体骤然放松有关，不主凶。',en:'Folk tradition calls it a falling start and links it to the body relaxing suddenly. No ill omen.'},{zh:'常见于「失去掌控感」的时期——工作、关系、健康任一项在松动。',en:'Common in seasons of losing grip, when work, relationship or health comes loose.'},{zh:'入睡时肌肉突然抽动（入睡抽动）也会产生坠落感，属正常生理现象。',en:'A hypnic jerk at sleep onset produces exactly this sensation. Perfectly ordinary.'},{zh:'问自己：最近哪件事我其实握不住了？写下来，就不必让身体替我记住。',en:'Ask: what am I no longer holding? Write it down so the body need not remember it for you.'}),
O(['追','赶','逃','被追','chase'],{zh:'梦到被追赶',en:'Dreaming of being chased'},{zh:'老辈说「梦里跑不动，是心里有债」——这话只当修辞听。',en:'The old saying goes, cannot run in a dream, there is a debt in the heart. Take it as poetry, not fact.'},{zh:'追赶者常是回避中的某件事、某个人，或某种情绪。它追你，是因为你不看它。',en:'The chaser is usually something avoided: a task, a person, a feeling. It chases because you will not look at it.'},{zh:'睡姿压迫胸口、睡前情绪激动也会诱发。',en:'Chest pressure from sleeping position, or agitation before bed, can trigger it too.'},{zh:'不逃的话，它会说什么？写第一句就行。',en:'If you stopped running, what would it say? Write only the first line.'}),
O(['牙','牙齿','掉牙','tooth'],{zh:'梦到牙齿脱落',en:'Dreaming of losing teeth'},{zh:'古解梦多把牙与亲人、口舌相连，说法芜杂且互相矛盾。',en:'Old dream books tie teeth to kin and to speech: densely, and contradictorily.'},{zh:'常见于对「失去体面」或「说了不该说的话」的焦虑。',en:'Often tracks anxiety about losing face, or about having said the wrong thing.'},{zh:'夜间磨牙、牙龈不适会真实地进入梦境。',en:'Bruxism and gum discomfort genuinely enter dreams.'},{zh:'最近有没有一句话，你咽下去了？它的后半句是什么。',en:'Is there a sentence you swallowed recently? What was the second half?'}),
O(['考试','考','考场','答题','exam'],{zh:'梦到考试',en:'Dreaming of an exam'},{zh:'传统的说法是「心里有事没了」。',en:'Tradition says simply: something is unfinished.'},{zh:'这是最典型的「被评价焦虑」梦——常出现在并非考试期的成年阶段。',en:'The classic being-judged dream. It shows up in adults nowhere near an exam.'},{zh:'往往与近期要交的东西、要面对的场合同步出现。',en:'Usually arrives alongside a deadline, or a room you have to walk into.'},{zh:'列出你正在被谁评价。划掉其中你并不在意的人。',en:'List who is judging you. Cross out the ones you do not actually care about.'}),

 'help.lead':'Three minutes, then you are done.',
 'help.1':'What this actually does','help.1b':'It does not predict, diagnose or tell fortunes. It does three things: helps you record the three turns of mind each day; draws the roads you have already walked into one map; and when you walk the same road for the Nth time, says quietly, hey, here again.',
 'help.2':'Why there are no streaks','help.2b':'Because punishing a missed day is itself an old pattern. It only shows days recorded in the last 30, and a gap triggers nothing at all.',
 'help.3':'What the four tracks are','help.3b':'For one event: how folklore reads it, how psychology reads it, what ordinary life explains, and what can be done. Four in parallel, never merged, never concluded. If none fit, that is normal.',
 'help.4':'The grey nodes on the map','help.4b':'Grey roads are ones you have not walked. Lit ones you have, and the thicker the line, the more often. It gives you no score.',
 'help.5':'When does Look. appear','help.5b':'When the same scene gets a different response from you, it appears by itself. Not a reward, but something you walked out yourself.',
 'faq.1':'Why no levels or achievements?','faq.1b':'Because that turns awareness into point-scoring. You would record for the score, then blame yourself when you stopped, which is exactly what we are trying to put down.',
 'faq.2':'Is my data uploaded?','faq.2b':'No. The page makes no external requests at all. Use it offline, or verify in your browser\u2019s network panel.',
 'faq.3':'Can I show this to someone?','faq.3b':'You can, but it is better not to. What is written here stops being true the moment it is written for an audience.',
 'faq.4':'Are the four tracks accurate?','faq.4b':'No. They are four angles of looking. The folk track especially is not fact; it is rhetoric, a poetics of daily life.',
 'faq.5':'What if I forget to record?','faq.5b':'Nothing happens. This software does not keep accounts.',
 'faq.6':'Why does the English read differently?','faq.6b':'Because some of this (karma, habitual tendency, the emotions of Chinese medicine, folk custom) loses its meaning outside its language. The English is a translation, not the original. Switch back to Chinese for that layer.',
 'faq.7':'Can I change the name or colours?','faq.7b':'Yes. The whole app is one HTML file; the name and accent colours are in the first few dozen lines. Edit and save, nothing to rebuild.',
 'tos.1':'This is a personal record-keeping and self-reflection aid. It provides <b>no medical advice, psychological diagnosis, or treatment</b>.',
 'tos.2':'Content relating to Chinese medicine, folklore and Buddhism is a presentation of cultural and traditional knowledge. It is not a medical conclusion, and must not be used for self-diagnosis or in place of medical care.',
 'tos.3':'The software does not predict the future, judge fortune, or offer any form of divination or prediction.',
 'tos.4':'All data is stored in your local browser only. The developer cannot access, collect, or upload any user data.',
 'tos.5':'If you are experiencing ongoing emotional distress, please seek professional help. This software is not a substitute for counselling or medical treatment.',
 'tos.6':'The software is provided as is, at your own risk. The developer is not liable for data loss caused by clearing browser caches, device failure, or similar.',
 'tos.7':'This is an unofficial third-party tool, unaffiliated with any medical institution, religious body, or platform.',
 'about.lead':'Origin and purpose.',
 'about.p1':'This software began with one ordinary question: why does the same thing keep happening to the same person. Folk coincidences, dream images, small bodily oddities, a sentence someone said in passing \u2014 the more threads gathered, the more they landed on one sentence:',
 'about.p2':'This software only wants people to see it a little earlier.',
 'about.p3':'The real turning does not happen in software. It happens next time \u2014 when the familiar line is about to leave your mouth, and you see it first. Seeing it is enough to move.',
 'about.four':'What the four doors mean',
 'about.f1':'The Folk Door','about.f1b':'Coincidence and dream imagery on four parallel tracks. Never merged, never judged.',
 'about.f2':'The Medicine Door','about.f2b':'Body signals set against emotion. Compared, never diagnosed.',
 'about.f3':'The Karma Door','about.f3b':'Repeating patterns, made visible, flagged, and met with one small act. The core.',
 'about.f4':'The Lineage Door','about.f4b':'Classical texts as cards, tied to daily entries. Content-driven, not yet built.',

 'author.note':'It explains no fate and promises no answer. It only keeps the lamp lit for the next time you reach the same door \u2014 so that you may recognise which time this is.',

/* v1.1：晚安时记「什么时候看见的」，不再打 0–10 的分。
   分数会变成要追的东西，那就又成了考试。
   老记录里存的还是数字，这里做一次映射，不迁移、不清空。 */
function whenOf(rec){
  if(!rec)return null;
  if(rec.when)return rec.when;
  if(typeof rec.awareness==='number'){
    if(rec.awareness>=9)return 'pre';
    if(rec.awareness>=7)return 'during';
    if(rec.awareness>=4)return 'after';
    return 'none';
  }
  return null;
}
var WHEN_LV={pre:4,during:3,after:2,none:1};
function whenMost(){
  var c={pre:0,during:0,after:0,none:0},k,n=0,i,best=null;
  for(i=0;i<S.seeds.length;i++){k=whenOf(S.seeds[i]);if(k){c[k]++;n++;}}
  if(!n)return null;
  for(k in c)if(best===null||c[k]>c[best])best=k;
  return {k:best,n:n,c:c};
}
function slotPanel(rec,k){

function trendHTML(){
  var days=[],any=false,i,j;
  for(i=13;i>=0;i--){
    var ts=Date.now()-i*86400000,key=dayKey(ts),v=null;
    var wk=null;
    for(j=0;j<S.seeds.length;j++)if(S.seeds[j].date===key)wk=whenOf(S.seeds[j])||wk;
    var v=wk?WHEN_LV[wk]:null;
    if(v!=null)any=true;
    days.push({v:v,d:new Date(ts).getDate()});
  }
  if(!any)return '';
  var h='<div class="divider"></div><div class="muted">'+esc(L('aware.trend'))+'</div>'+
        '<div class="muted" style="font-size:.75rem;margin-top:2px">'+esc(L('aware.trendsub'))+'</div><div class="trend">';
  for(var m=0;m<days.length;m++){
    var d=days[m],pct=d.v==null?3:(14+d.v*20);
    h+='<div class="b"><div class="bar'+(d.v==null?' e':'')+'" style="height:'+pct+'%"></div><div class="lb">'+d.d+'</div></div>';
  }
  return h+'</div>';
}
function todayQuestion(){
  var qs=[],i;
  for(i=0;i<S.seeds.length;i++){
    var nn=S.seeds[i].night;
    if(nn&&nn.length>6&&nn.indexOf('？')>=0)qs.push(nn);
  }
  if(qs.length&&Math.random()<0.5)return qs[Math.floor(Math.random()*qs.length)];
  var d=new Date();
  var seed=d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate();
  return T(QUESTIONS[seed%QUESTIONS.length]);
}
function findFlashback(){
  var pool=[],i;
  for(i=0;i<S.seeds.length;i++){
    var r=S.seeds[i],dd=Math.floor((Date.now()-new Date(r.date).getTime())/86400000);
    if(r.night&&r.night.length>4&&dd>=21)pool.push({text:r.night,days:dd,id:r.id});
  }
  for(i=0;i<S.omens.length;i++){
    var o=S.omens[i],dd2=daysAgo(o.at);
    if(o.text&&o.text.length>3&&dd2>=21)pool.push({text:o.text,days:dd2,id:o.id});
  }
  if(!pool.length)return null;
  pool.sort(function(a,b){return a.days-b.days;});
  var pick=pool[0],ans=null;
  for(i=0;i<S.flashbacks.length;i++)if(S.flashbacks[i].refId===pick.id)ans=S.flashbacks[i].answer;
  pick.answered=ans;
  return pick;
}
function exitCheck(){
  var hits=0,high=false,i,j;
  var cutoff=Date.now()-14*86400000;
  function scan(txt){
    if(!txt)return;
    var low=String(txt).toLowerCase();
    for(var a=0;a<HIGHWORDS.length;a++)if(low.indexOf(HIGHWORDS[a])>=0){high=true;return;}
    for(var b=0;b<NEGWORDS.length;b++)if(low.indexOf(NEGWORDS[b])>=0){hits++;return;}
  }
  for(i=0;i<S.seeds.length;i++){
    if(new Date(S.seeds[i].date).getTime()<cutoff)continue;
    scan(S.seeds[i].night);
    for(j=0;j<(S.seeds[i].midday||[]).length;j++)scan(S.seeds[i].midday[j]);
  }
  for(i=0;i<S.omens.length;i++){
    if(new Date(S.omens[i].at).getTime()<cutoff)continue;
    scan(S.omens[i].text);
  }
  for(i=0;i<S.events.length;i++)scan(S.events[i].note);
  var lowN=0,tot=0;
  for(i=0;i<S.seeds.length;i++){
    if(new Date(S.seeds[i].date).getTime()<cutoff)continue;
    if(S.seeds[i].awareness!=null){tot++;if(S.seeds[i].awareness<=2)lowN++;}
  }
  if(high)return true;
  if(hits>=2)return true;
  if(lowN>=3&&tot>=3)return true;
  return false;
}

function buildGraph(){

  var list=S.events;

  if(ui.mapWin==='w30')list=list.filter(function(e){return daysAgo(e.at)<=30;});
  for(i=0;i<list.length;i++){
    var e=list[i];
    tCount[e.trigger]=(tCount[e.trigger]||0)+1;
    rCount[e.reaction]=(rCount[e.reaction]||0)+1;
    tSeen[e.trigger]=1;rSeen[e.reaction]=1;
    var k=e.trigger+'\u0001'+e.reaction;
    edge[k]=(edge[k]||0)+1;
  }
  var trigs=uniq(Object.keys(tSeen).concat(TERMS.zh[0]));
  var reacts=uniq(Object.keys(rSeen).concat(TERMS.zh[1]));
  trigs.sort(function(a,b){return (tCount[b]||0)-(tCount[a]||0);});
  reacts.sort(function(a,b){return (rCount[b]||0)-(rCount[a]||0);});
  return {trigs:trigs,reacts:reacts,tCount:tCount,rCount:rCount,edge:edge,tSeen:tSeen,rSeen:rSeen,list:list};
}

function graphSVG(g){
  var W=600,rowH=44,padTop=26,nh=30,nw=126,lx=8,rx=W-nw-8;
  var n=Math.max(g.trigs.length,g.reacts.length);
  var H=padTop*2+(n-1)*rowH+34,i,j,k;
  function yOf(i2,total){return padTop+(i2*rowH)+Math.max(0,(n-total)*rowH/2);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(L('map.title'))+'">';
  var tPos={},rPos={};
  for(i=0;i<g.trigs.length;i++)tPos[g.trigs[i]]={x:lx+nw,y:yOf(i,g.trigs.length)+nh/2};
  for(j=0;j<g.reacts.length;j++)rPos[g.reacts[j]]={x:rx,y:yOf(j,g.reacts.length)+nh/2};
  for(k in g.edge){
    var p=k.split('\u0001'),a=tPos[p[0]],b=rPos[p[1]];
    if(!a||!b)continue;
    var c=g.edge[k],sw=Math.min(1+c*0.9,4.5),op=Math.min(0.22+c*0.16,0.95),mx=(a.x+b.x)/2;
    s+='<path d="M'+a.x+' '+a.y+' C '+mx+' '+a.y+', '+mx+' '+b.y+', '+b.x+' '+b.y+'" fill="none" stroke="var(--acc2)" stroke-width="'+sw.toFixed(1)+'" opacity="'+op.toFixed(2)+'"/>';
  }
  for(var t in tPos){
    var on=g.tSeen[t],p2=tPos[t];
    s+='<g data-act="pickNode" data-ty="t" data-t="'+esc(t)+'" style="cursor:pointer">'+
       '<rect x="'+lx+'" y="'+(p2.y-nh/2)+'" width="'+nw+'" height="'+nh+'" rx="8" fill="var(--card2)" stroke="'+(on?'var(--acc2)':'var(--line)')+'" stroke-width="0.5"'+(on?'':' stroke-dasharray="3 3"')+'/>'+
       '<text x="'+(lx+nw/2)+'" y="'+p2.y+'" fill="'+(on?'var(--tx)':'var(--tx3)')+'" font-size="12" text-anchor="middle" dominant-baseline="central">'+esc(trTerm(t))+(g.tCount[t]>1?' '+g.tCount[t]:'')+'</text></g>';
  }
  for(var r in rPos){
    var on2=g.rSeen[r],p3=rPos[r];
    s+='<g data-act="pickNode" data-ty="r" data-t="'+esc(r)+'" style="cursor:pointer">'+
       '<rect x="'+rx+'" y="'+(p3.y-nh/2)+'" width="'+nw+'" height="'+nh+'" rx="8" fill="var(--card2)" stroke="'+(on2?'var(--acc)':'var(--line)')+'" stroke-width="0.5"'+(on2?'':' stroke-dasharray="3 3"')+'/>'+
       '<text x="'+(rx+nw/2)+'" y="'+p3.y+'" fill="'+(on2?'var(--tx)':'var(--tx3)')+'" font-size="12" text-anchor="middle" dominant-baseline="central">'+esc(trTerm(r))+(g.rCount[r]>1?' '+g.rCount[r]:'')+'</text></g>';
  }
  return s+'</svg>';
}
function findAlert(g){
  var best=null,bn=0;
  for(var k in g.edge){
    var p=k.split('\u0001');
    if(g.edge[k]>=3&&g.edge[k]>bn){bn=g.edge[k];best={trigger:p[0],reaction:p[1],n:g.edge[k]};}
  }
  if(!best)return null;
  best.shift=shiftFor(best.reaction);
  return best;
}
function findEpiphany(){
  var byT={},i,t;
  for(i=0;i<S.events.length;i++){
    var e=S.events[i];
    if(!byT[e.trigger])byT[e.trigger]=[];
    byT[e.trigger].push(e);
  }
  var res=null;
  for(t in byT){
    var arr=byT[t].slice().sort(function(a,b){return new Date(a.at)-new Date(b.at);});
    if(arr.length<2)continue;
    if(arr[0].reaction!==arr[arr.length-1].reaction)res={trigger:t,first:arr[0],last:arr[arr.length-1]};
  }
  return res;
}
function coolDownStat(){
  var sum=0,c=0;
  for(var i=0;i<S.events.length;i++){
    var e=S.events[i];
    if(e.coolDownHours!=null&&e.coolDownHours>0){sum+=e.coolDownHours;c++;}
  }
  if(!c)return null;
  return {h:Math.round(sum/c*10)/10,n:c};
}

function handleFile(ev){
  var f=ev&&ev.target&&ev.target.files&&ev.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result));
      var d=o&&o.data?o.data:o;
      if(!d||!d.seeds)throw new Error('bad');
      S=d;loadOn(S);save();applyTheme();applyLang();ui.panel=null;render();
    }catch(e){alert(L('set.badfile'));}
  };
  r.readAsText(f);
}

function handle(act,el){
  var k=el.getAttribute('data-k'),v=el.getAttribute('data-v'),i;
  if(act==='go'){go(v);return;}
  if(act==='enter'){hideSplash();return;}
  if(act==='cycleTheme'){cycleTheme();return;}
  if(act==='cycleLang'){cycleLang();return;}
  if(act==='setTheme'){S.theme=v;save();applyTheme();render();return;}
  if(act==='setLang'){S.lang=v;save();applyTheme();applyLang();render();return;}
  if(act==='setUi'){S.ui=parseInt(v,10)||100;save();applyTheme();render();return;}
  if(act==='setMotion'){S.motion=v;save();applyTheme();render();return;}
  if(act==='setDoc'){ui.doc=v;render();return;}
  if(act==='setWin'){ui.mapWin=v;ui.node=null;render();return;}
  if(act==='replaySplash'){showSplash();return;}
  if(act==='openSlot'){ui.panel=(ui.panel===k?null:k);render();return;}
  if(act==='closeSlot'){ui.panel=null;render();return;}
  if(act==='pickNight'){var rn=todaySeed();rn.night=(rn.night===v?'':v);save();render();return;}
  if(act==='pickWhen'){var rw=todaySeed();rw.when=(rw.when===v?null:v);save();render();return;}
  if(act==='pick'||act==='pickMulti'){
    var rec=todaySeed();
    if(act==='pick')rec.morning=(rec.morning===v?null:v);
    else{
      rec.midday=rec.midday||[];
      var ix=rec.midday.indexOf(v);
      if(ix>=0)rec.midday.splice(ix,1);else rec.midday.push(v);
    }
    save();render();return;
  }
  if(act==='saveSlot'){
    var rec2=todaySeed();
    if(k==='night'){
      var t=document.getElementById('nightTxt');
      if(t)rec2.nightNote=String(t.value||'').trim();
    }
    save();ui.panel=null;render();return;
  }
  if(act==='matchOmen'){matchOmen();return;}
  if(act==='saveEvent'){
    var tr=String(ui.ev.T||'').trim(),re=String(ui.ev.R||'').trim();
    if(!tr||!re)return;
    S.events.push({id:uid(),at:new Date().toISOString(),trigger:tr,reaction:re,
      coolDownHours:(ui.ev.C?parseInt(ui.ev.C,10):null),note:'',san:ui.ev.san||'yi'});
    ui.ev={T:'',R:'',C:'',san:ui.ev.san||'yi',oT:false,oR:false};
    save();render();return;
  }
  if(act==='acceptShift'){
    S.shifts.push({id:uid(),pattern:el.getAttribute('data-t')+' → '+el.getAttribute('data-r'),action:SHIFT_MAP[el.getAttribute('data-r')]||{zh:'换个反应试一次。',en:'Try a different response.'},createdAt:new Date().toISOString(),trials:[]});
    save();render();return;
  }
  if(act==='dismissAlert')return;
  if(act==='trial'){
    var id=el.getAttribute('data-id');
    for(i=0;i<S.shifts.length;i++)if(S.shifts[i].id===id)S.shifts[i].trials.push({at:new Date().toISOString(),note:'ok'});
    save();render();return;
  }
  if(act==='pickNode'){var t3=el.getAttribute('data-t');ui.node=(ui.node===t3?null:t3);ui.nodeType=el.getAttribute('data-ty')||'t';render();return;}
  if(act==='saveFb'){
    var a=document.getElementById('fbAns'),txt=a?String(a.value||'').trim():'';
    var fb=findFlashback();
    if(fb&&txt)S.flashbacks.push({refId:fb.id,answer:txt,at:new Date().toISOString()});
    save();render();return;
  }
  if(act==='quizPick'){ui.quizAns[ui.quizIdx]=parseInt(el.getAttribute('data-i'),10);render();return;}
  if(act==='quizPrev'){ui.quizIdx=Math.max(0,ui.quizIdx-1);render();return;}
  if(act==='quizNext'){
    if(ui.quizIdx<QUIZ.length-1){ui.quizIdx++;render();return;}
    S.profile.done=true;S.profile.answers=ui.quizAns;S.profile.result=pickResult(ui.quizAns);
    save();render();return;
  }
  if(act==='redoQuiz'){S.profile.done=false;ui.quizIdx=0;ui.quizAns={};save();render();return;}
  if(act==='wPick'){
    var wf=el.getAttribute('data-f'),wi=parseInt(el.getAttribute('data-i'),10),ww=wF(wf);
    if(ww){
      var wst=wParse(wGet(wf)),wfree=curFree(wf,wst.free),wpos=wst.sel.indexOf(wi);
      if(ww.multi){
        if(wpos>=0)wst.sel.splice(wpos,1);
        else{
          var wkept=[];
          for(i=0;i<wst.sel.length;i++)if(wst.sel[i]<ww.op.length)wkept.push(wst.sel[i]);
          wst.sel=wkept;
          while(wst.sel.length>=ww.multi)wst.sel.shift();
          wst.sel.push(wi);
        }
      }else{
        wst.sel=(wpos>=0?[]:[wi]);
      }
      if(wst.sel.indexOf(ww.op.length)<0)ui.wOther[wf]=false;
      wSet(wf,wBuild(wst.sel,wfree));save();render();
    }
    return;
  }
  if(act==='wOther'){
    var w2f=el.getAttribute('data-f'),w2w=wF(w2f);
    if(w2w){
      var w2st=wParse(wGet(w2f)),w2free=curFree(w2f,w2st.free),w2p=w2st.sel.indexOf(w2w.op.length);
      if(w2p>=0){w2st.sel.splice(w2p,1);ui.wOther[w2f]=false;}
      else{w2st.sel.push(w2w.op.length);ui.wOther[w2f]=true;}
      wSet(w2f,wBuild(w2st.sel,w2free));save();render();
      var w2el=document.getElementById(freId(w2f));
      if(ui.wOther[w2f]&&w2el&&w2el.focus)w2el.focus();
    }
    return;
  }
  if(act==='omenQuick'){matchOmen(el.getAttribute('data-v'));return;}
  if(act==='evPick'){
    var es=el.getAttribute('data-s'),ev=el.getAttribute('data-v');
    ui.ev[es]=(ui.ev[es]===ev?'':ev);ui.ev['o'+es]=false;render();return;
  }
  if(act==='evOther'){
    var os_=el.getAttribute('data-s'),oon=!ui.ev['o'+os_];
    ui.ev['o'+os_]=oon;
    if(oon){
      var otl=termList(os_==='T'?0:1),ohit=false;
      for(i=0;i<otl.length;i++)if(ui.ev[os_]===otl[i].zh)ohit=true;
      if(ohit)ui.ev[os_]='';
    }
    render();
    var oe=document.getElementById('evFree'+os_);
    if(oon&&oe&&oe.focus)oe.focus();
    return;
  }
  if(act==='evPickC'){var cv=el.getAttribute('data-v');ui.ev.C=(ui.ev.C===cv?'':cv);render();return;}
  if(act==='evSan'){var sv=el.getAttribute('data-v');ui.ev.san=sv;render();return;}
  if(act==='p4start'){ui.p4={on:true,step:0,tr:'',re:'',ack:null,stop:null,altI:null,done:false};go('record');return;}
  if(act==='p4exit'){ui.p4={on:false,step:0,tr:'',re:'',ack:null,stop:null,altI:null,done:false};render();return;}
  if(act==='p4ok'){ui.p4.done=false;render();return;}
  if(act==='p4pickT'){var pt=el.getAttribute('data-s'),pv=el.getAttribute('data-v');ui.p4[pt]=(ui.p4[pt]===pv?'':pv);render();return;}
  if(act==='p4flag'){var pf=el.getAttribute('data-s'),pi=parseInt(el.getAttribute('data-i'),10);ui.p4[pf]=(ui.p4[pf]===pi?null:pi);render();return;}
  if(act==='p4alt'){ui.p4.altI=parseInt(el.getAttribute('data-i'),10);render();return;}
  if(act==='p4next'){
    if(ui.p4.step===0&&(!ui.p4.tr||!ui.p4.re))return;
    if(ui.p4.step===1&&ui.p4.ack===null)return;
    if(ui.p4.step===2&&ui.p4.stop===null)return;
    ui.p4.step=Math.min(3,(ui.p4.step||0)+1);
    if(ui.p4.step===3&&ui.p4.altI==null){
      var aix=TERMS.zh[1].indexOf(ui.p4.re);
      ui.p4.altI=(aix>=0?aix:0);
    }
    render();return;
  }
  if(act==='p4seal'){
    if(ui.p4.altI==null)return;
    var az=TERMS.zh[1][ui.p4.altI];
    S.shifts.push({id:uid(),pattern:ui.p4.tr+' → '+ui.p4.re,
      action:SHIFT_MAP[az]||{zh:'换个反应试一次。',en:'Try a different response.'},
      createdAt:new Date().toISOString(),trials:[],from:'p4'});
    save();
    ui.p4={on:false,step:0,tr:'',re:'',ack:null,stop:null,altI:null,done:true};
    render();return;
  }
  if(act==='saveWorlds'){saveWorlds();return;}
  if(act==='exportJson'){exportJson();return;}
  if(act==='importJson'){importJson();return;}
  if(act==='wipe'){wipe();return;}
}

     此时不再出第二张海报——两页海报都要点「入内」，是重复的。
     URL 上的一次性标记用 replaceState 抹掉，直接刷新时开屏照常。 */
  var cameIn=false;

/* ================= v1.1 配乐 =================
   配乐是本地附件（music/ 目录），不上仓库、不上线。
   探不到音频文件时，按钮与设置栏目一起隐藏——在线版就是没有这一栏。
   MUSIC = [曲名, 音量]；音量按各自的实测响度调过，换曲子只改这张表。 */
var MUSIC=[['qinxiao',0.50],['guqin',1.00],['stream',1.00]];
function musicFile(id){return 'music/'+id+'.mp3';}
function musicVol(id){for(var i=0;i<MUSIC.length;i++)if(MUSIC[i][0]===id)return MUSIC[i][1];return 0.5;}
function musicEl(){return document.getElementById('bgm');}
/* 探一次「有没有音频文件」。只预载 metadata，代价是一个很短的请求。 */
function musicProbe(){
  if(ui.musicProbe!=null){ui.musicOK=ui.musicProbe;return;}
  ui.musicProbe=false;ui.musicOK=false;
  try{
    var a=new Audio();
    a.preload='metadata';
    a.addEventListener('loadedmetadata',function(){ui.musicProbe=true;ui.musicOK=true;render();});
    a.addEventListener('error',function(){ui.musicProbe=false;ui.musicOK=false;render();});
    a.src=musicFile(S.musicTrack||MUSIC[0][0]);
  }catch(e){}
}
function musicSync(){
  var el=musicEl();if(!el)return;
  ui.musicTap=false;
  try{
    if(!S.musicOn||!S.musicTrack){el.pause();return;}
    var src=musicFile(S.musicTrack);
    if(el.getAttribute('src')!==src)el.setAttribute('src',src);
    el.volume=musicVol(S.musicTrack);
    var p=el.play();
    if(p&&p.then)p.then(function(){},function(){ui.musicTap=true;});
  }catch(e){ui.musicTap=true;}
}
function musicToggle(){
  if(!S.musicTrack)S.musicTrack=MUSIC[0][0];
  S.musicOn=!S.musicOn;save();musicSync();render();
}
function musicBoot(){
  musicProbe();
  if(S.musicOn)musicSync();
  /* 浏览器会拦住「没点过就自动播」。第一次点页面时补上，不弹窗、不提示。 */
  document.addEventListener('click',function(){if(ui.musicTap&&S.musicOn)musicSync();},true);
}

/* ---------- 本周老路 ---------- */
function weekRoads(){
  var now=Date.now(),w1=now-7*86400000,w2=now-14*86400000,i,cur={},prev={};
  for(i=0;i<S.events.length;i++){
    var e=S.events[i],t=new Date(e.at).getTime();
    if(isNaN(t))continue;
    var k=e.trigger+'\u0001'+e.reaction;
    if(t>=w1)cur[k]=(cur[k]||0)+1;
    else if(t>=w2)prev[k]=(prev[k]||0)+1;
  }
  var rows=[];
  for(var kk in cur)if(cur[kk]>=2)rows.push({k:kk,n:cur[kk],p:prev[kk]||0});
  rows.sort(function(a,b){return b.n-a.n;});
  return rows;
}
function weekCard(){
  var rows=weekRoads(),h='',i;
  h='<div class="card"><h2>'+esc(L('wk.title'))+'</h2><div class="sub">'+esc(L('wk.lead'))+'</div>';

  }else{
    for(i=0;i<rows.length;i++){
      var p=rows[i].k.split('\u0001'),pct=Math.min(100,rows[i].n*22);
      h+='<div style="padding:11px 0;border-bottom:1px solid var(--line)">'+

         '<div class="wkn" style="font-family:var(--serif);color:var(--acc);font-size:.9375rem">'+esc(L('wk.times').replace('{n}',rows[i].n))+'</div>'+

/* ---------- 加密导出 ---------- */
function b64(buf){
  var b='',a=new Uint8Array(buf),i;
  for(i=0;i<a.length;i++)b+=String.fromCharCode(a[i]);
  return btoa(b);
}
function unb64(s){
  var bin=atob(s),a=new Uint8Array(bin.length),i;
  for(i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return a;
}
function hasSubtle(){
  try{return !!(typeof window!=='undefined'&&window.crypto&&window.crypto.subtle&&window.crypto.subtle.importKey&&window.crypto.getRandomValues);}
  catch(e){return false;}
}
async function deriveKey(pass,salt){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),{name:'PBKDF2'},false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:120000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function dlFile(name,text){
  try{
    var blob=new Blob([text],{type:'application/json'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  }catch(e){}
}
async function exportJson(){
  var pass='';
  try{pass=window.prompt(L('enc.t')+'\n'+L('enc.lead'),'')||'';}catch(e){pass='';}
  var payload={app:APP.en,v:S.v,exported:new Date().toISOString(),lang:lang(),data:S};
  var text=JSON.stringify(payload,null,2);
  var name=APP.en+'-'+today();
  if(pass&&hasSubtle()){
    try{
      var salt=crypto.getRandomValues(new Uint8Array(16));
      var iv=crypto.getRandomValues(new Uint8Array(12));
      var key=await deriveKey(pass,salt);
      var ct=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,new TextEncoder().encode(text));
      dlFile(name+'.enc.json',JSON.stringify({app:APP.en,enc:true,kdf:'PBKDF2-SHA256-120000',salt:b64(salt),iv:b64(iv),ct:b64(ct)},null,2));
      alert(L('enc.ok'));
      return;
    }catch(e){}
  }
  if(pass&&!hasSubtle())alert(L('enc.no'));
  dlFile(name+'.json',text);
}
function applyImport(d){
  if(!d||!d.seeds)throw new Error('bad');
  S=d;loadOn(S);save();applyTheme();applyLang();ui.panel=null;render();
}
function handleFile(ev){
  var f=ev&&ev.target&&ev.target.files&&ev.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var txt=String(r.result),o=null;
    try{o=JSON.parse(txt);}catch(e){alert(L('set.badfile'));return;}
    if(o&&o.enc){
      if(!hasSubtle()){alert(L('enc.enc'));return;}
      var p='';
      try{p=window.prompt(L('enc.enc'),'')||'';}catch(e){p='';}
      (async function(){
        try{
          var key=await deriveKey(p,unb64(o.salt));
          var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(o.iv)},key,unb64(o.ct));
          applyImport(JSON.parse(new TextDecoder().decode(pt)));
        }catch(e){alert(L('enc.bad'));}
      })();
      return;
    }
    try{applyImport(o&&o.data?o.data:o);}catch(e){alert(L('set.badfile'));}
  };
  r.readAsText(f);
}

      if(w2p>=0){w2st.sel.splice(w2p,1);ui.wOther[w2f]=false;}
      else{w2st.sel.push(w2w.op.length);ui.wOther[w2f]=true;}
      wSet(w2f,wBuild(w2st.sel,w2free));save();render();
      var w2el=document.getElementById(freId(w2f));
      if(ui.wOther[w2f]&&w2el&&w2el.focus)w2el.focus();
    }
    return;
  }
  if(act==='omenQuick'){matchOmen(el.getAttribute('data-v'));return;}
  if(act==='evPick'){
    var es=el.getAttribute('data-s'),ev=el.getAttribute('data-v');
    ui.ev[es]=(ui.ev[es]===ev?'':ev);ui.ev['o'+es]=false;render();return;
  }
  if(act==='evOther'){
    var os_=el.getAttribute('data-s'),oon=!ui.ev['o'+os_];
    ui.ev['o'+os_]=oon;
    if(oon){
      var otl=termList(os_==='T'?0:1),ohit=false;
      for(i=0;i<otl.length;i++)if(ui.ev[os_]===otl[i].zh)ohit=true;
      if(ohit)ui.ev[os_]='';
    }
    render();
    var oe=document.getElementById('evFree'+os_);
    if(oon&&oe&&oe.focus)oe.focus();
    return;
  }
  if(act==='evPickC'){var cv=el.getAttribute('data-v');ui.ev.C=(ui.ev.C===cv?'':cv);render();return;}
  if(act==='evSan'){var sv=el.getAttribute('data-v');ui.ev.san=sv;render();return;}
  if(act==='p4start'){ui.p4={on:true,step:0,tr:'',re:'',ack:null,stop:null,altI:null,done:false};go('record');return;}
  if(act==='p4exit'){ui.p4={on:false,step:0,tr:'',re:'',ack:null,stop:null,altI:null,done:false};render();return;}
  if(act==='p4ok'){ui.p4.done=false;render();return;}
  if(act==='p4pickT'){var pt=el.getAttribute('data-s'),pv=el.getAttribute('data-v');ui.p4[pt]=(ui.p4[pt]===pv?'':pv);render();return;}
  if(act==='p4flag'){var pf=el.getAttribute('data-s'),pi=parseInt(el.getAttribute('data-i'),10);ui.p4[pf]=(ui.p4[pf]===pi?null:pi);render();return;}
  if(act==='p4alt'){ui.p4.altI=parseInt(el.getAttribute('data-i'),10);render();return;}
  if(act==='p4next'){
    if(ui.p4.step===0&&(!ui.p4.tr||!ui.p4.re))return;
    if(ui.p4.step===1&&ui.p4.ack===null)return;
    if(ui.p4.step===2&&ui.p4.stop===null)return;
    ui.p4.step=Math.min(3,(ui.p4.step||0)+1);
    if(ui.p4.step===3&&ui.p4.altI==null){
      var aix=TERMS.zh[1].indexOf(ui.p4.re);
      ui.p4.altI=(aix>=0?aix:0);
    }
    render();return;
  }
  if(act==='p4seal'){
    if(ui.p4.altI==null)return;
    var az=TERMS.zh[1][ui.p4.altI];
    S.shifts.push({id:uid(),pattern:ui.p4.tr+' → '+ui.p4.re,
      action:SHIFT_MAP[az]||{zh:'换个反应试一次。',en:'Try a different response.'},
      createdAt:new Date().toISOString(),trials:[],from:'p4'});
    save();
    ui.p4={on:false,step:0,tr:'',re:'',ack:null,stop:null,altI:null,done:true};
    render();return;
  }
  if(act==='saveWorlds'){saveWorlds();return;}
  if(act==='exportJson'){exportJson();return;}
  if(act==='importJson'){importJson();return;}
  if(act==='wipe'){wipe();return;}
}

var WSEP='\u0001';
function freId(f){return 'w_free_'+f.replace('.','_');}
function wF(f){for(var i=0;i<WF.length;i++)if(WF[i].f===f)return WF[i];return null;}
function wGet(f){var p=f.split('.');return (S.worlds&&S.worlds[p[0]]&&S.worlds[p[0]][p[1]])||'';}
function wSet(f,v){var p=f.split('.');if(!S.worlds[p[0]])S.worlds[p[0]]={};S.worlds[p[0]][p[1]]=v;}
/* 值格式：'@0|@3<WSEP>自由文本'（'@序号'=点选的预设，WSEP 后为「其它」里写的字）
   v0.3 的纯文本旧数据不含 '@'，按自由文本读出，不丢 */
function wParse(v){
  v=String(v==null?'':v);
  var free='',s=v,ix=v.indexOf(WSEP);
  if(ix>=0){s=v.slice(0,ix);free=v.slice(ix+1);}
  var sel=[];
  if(s.charAt(0)==='@'){
    var a=s.split('|');
    for(var i=0;i<a.length;i++){var n=parseInt(a[i].slice(1),10);if(!isNaN(n))sel.push(n);}
  }else if(s){free=s;}
  return {sel:sel,free:free};
}
function wBuild(sel,free){
  var s='';
  if(sel&&sel.length){var a=[];for(var i=0;i<sel.length;i++)a.push('@'+sel[i]);s=a.join('|');}
  free=String(free==null?'':free);
  if(free)return s?s+WSEP+free:free;
  return s;
}
function wCount(){
  var n=0;for(var i=0;i<WF.length;i++)if(String(wGet(WF[i].f)||'')!=='')n++;
  return n;
}
function curFree(f,cur){
  var e=document.getElementById(freId(f));
  return e?String(e.value||''):(cur||'');
}
function wFieldHTML(w){
  var st=wParse(wGet(w.f));
  var oth=(st.sel.indexOf(w.op.length)>=0)||!!ui.wOther[w.f];

  if(oth)h+='<input class="fin" type="text" id="'+freId(w.f)+'" data-f="'+w.f+'" value="'+esc(st.free)+'" placeholder="'+esc(L('self.wfreeph'))+'">';

function inkScene(seed,w,h,opt){

/* ---------- 三看卡：一件事，三种读法并排 ---------- */
function threeReadCard(){
  var d=THREE_READS[Math.floor(Math.random()*THREE_READS.length)];
  var rows=[[L('three.e'),d.m,''],[L('three.y'),d.y,'a'],[L('three.c'),d.c,'']],h='',k;
  h+='<div class="card"><h2>'+glspan('eye')+esc(L('br.3'))+'</h2>'+
     '<div class="sub">'+esc(L('br.3lead'))+'</div>'+
     '<div class="omen"><div class="oh">'+esc(T(d.e))+'</div><div class="track4">';
  for(k=0;k<rows.length;k++)
    h+='<div class="tr4 '+rows[k][2]+'"><div class="lb">'+esc(rows[k][0])+'</div><div class="tx">'+esc(T(rows[k][1]))+'</div></div>';
  return h+'</div></div><div class="qknote" style="margin-top:14px">'+esc(L('br.3note'))+'</div></div>';
}
/* ---------- 旧书一句卡：原句 + 出处 + 人话 ---------- */
function oldLineCard(){
  var d=OLD_LINES[Math.floor(Math.random()*OLD_LINES.length)];
  return '<div class="card"><h2>'+glspan('scroll')+esc(L('br.old'))+'</h2>'+
    '<div class="sub">'+esc(L('br.oldlead'))+'</div>'+
    '<div class="oldq"><div class="oldqt">「'+esc(T(d.t))+'」</div>'+
    '<div class="oldqs">'+esc(T(d.s))+'</div>'+
    '<div class="oldpw">'+esc(T(d.p))+'</div></div>'+
    '<div class="qknote" style="margin-top:14px">'+esc(L('br.oldnote'))+'</div></div>';
}

/* ---------- 随览：只递东西，不问你任何问题 ---------- */
function viewBrowse(){
  var k=ui.brK==null?0:ui.brK,h='';
  h+='<div class="card"><h2>'+glspan('scroll')+esc(L('nav.browse'))+'</h2>'+
     '<div class="sub">'+esc(L('br.lead'))+'</div><div class="gates">'+gateStrip()+'</div></div>';
  if(k===0){
    var s=ui.brSeed==null?daySeed():ui.brSeed;
    h+='<div class="card"><h2>'+glspan('moon')+esc(L('br.pair'))+'</h2>'+
       '<div style="margin-top:14px">'+brPairHTML(duiPick(s))+'</div></div>';
  }else if(k===1){
    h+=kbCard();
  }else if(k===2){
    h+=inkBig();
  }else if(k===3){
    h+=threeReadCard();
  }else{
    h+=oldLineCard();
  }
  h+='<div class="card brbar"><button class="btn sm" data-act="brNext">'+esc(L('br.again'))+'</button>'+
     '<button class="btn sm ghost" data-act="brKind">'+esc(L('br.kind'))+'</button>'+
     '<span class="muted">'+esc(L('br.foot'))+'</span></div>';
  return h;
}
